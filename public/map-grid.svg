<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-large" width="250" height="250" patternUnits="userSpaceOnUse">
      <path d="M 250 0 L 0 0 0 250" fill="none" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect width="100%" height="100%" fill="url(#grid-large)" />
</svg>
